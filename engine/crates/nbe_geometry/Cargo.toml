[package]
name = "nbe_geometry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Pure deterministic geometry math. Only dependency is glam 0.30 — the exact version Bevy 0.18
# uses — so the Vec3 produced here IS Bevy's Vec3 (no conversion in the renderer). No GPU.
[dependencies]
glam = "0.30"

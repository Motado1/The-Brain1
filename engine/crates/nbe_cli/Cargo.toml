[package]
name = "nbe_cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Terminal hub for entering & reporting on real data (clients, invoices, expenses, notes)
# against the same single SQLite file the visual engine renders. lib + thin bin so the command
# handlers are unit-testable headlessly.
[lib]
name = "nbe_cli"
path = "src/lib.rs"

[[bin]]
name = "nbe"
path = "src/main.rs"

[dependencies]
nbe_data = { path = "../nbe_data" }
nbe_sim = { path = "../nbe_sim" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }

[package]
name = "nbe_calendar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Pull-only calendar sync. The ICS parser + event->client matcher are pure/std (fully testable
# headlessly); the live HTTPS fetch of a private Google Calendar .ics URL is behind the `http`
# feature (ureq + rustls), so the app stays offline unless the user clicks sync.
[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
ureq = { version = "2", optional = true }

[package]
name = "nbe_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Brain — neural business engine"

# Standalone desktop packaging via `cargo bundle` (run on the target OS). Produces an app with a name
# + icon so it launches without a terminal. Add an icon at the path below (256² PNG / .ico) and run
# `cargo bundle --release -p nbe_app` on the workstation. See docs/PACKAGING.md.
[package.metadata.bundle]
name = "The Brain"
identifier = "com.nbe.thebrain"
# icon = ["assets/icon.png"]   # uncomment once an icon exists
category = "Productivity"
short_description = "Neural business engine for a personal-training practice."

[dependencies]
bevy = { workspace = true }
bevy_egui = "0.39"
nbe_data = { path = "../nbe_data" }
nbe_layout = { path = "../nbe_layout" }
nbe_geometry = { path = "../nbe_geometry" }
nbe_cli = { path = "../nbe_cli" }
# Native file-open dialog for the "Add Research" button. On Windows this uses the native Win32
# picker; the xdg-portal backend keeps the Linux build free of GTK system deps (for CI/checks).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
